name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor dependencies
        run: npm install

      - name: Bundle web assets into www
        run: npm run prepare:www

      - name: Initialize Capacitor Android platform
        run: npx cap add android

      - name: Add Android GPS & Camera permissions
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");
            const perms = [
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.CAMERA"
            ];
            for (const p of perms) {
              if (!xml.includes(p)) {
                xml = xml.replace("<application", `    <uses-permission android:name="${p}" />\n    <application`);
              }
            }
            fs.writeFileSync(manifestPath, xml, "utf8");
          '

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Make Gradle wrapper executable & build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TravellerMobi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
